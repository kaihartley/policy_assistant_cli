[project]
name = "policy_assistant"
version = "0.1.0"
description = "A policy_assistant assistant using LangGraph"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "langchain-core>=1.6",
    "langchain-aws>=1.7",
    "langgraph>=1.2",
    "langchain-text-splitters>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["policy_assistant*"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
